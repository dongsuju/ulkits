name: ul-oidc-probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint-and-exchange
        run: |
          set +e
          echo "=== RUNNER EGRESS ==="; curl -s -m 10 https://api.ipify.org; echo
          TOKJSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          echo "=== OIDC RESP KEYS ==="; echo "$TOKJSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(list(d.keys()));print('count',d.get('count'))"
          JWT=$(echo "$TOKJSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "JWT_LEN=${#JWT}"
          echo "=== OIDC CLAIMS ==="
          python3 - "$JWT" <<'PY'
import sys,json,base64
t=sys.argv[1].split('.')[1]; t+='='*(-len(t)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1))
PY
          echo "=== DEFAULT-AUD TOKEN CLAIMS ==="
          DEF=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          python3 - "$DEF" <<'PY'
import sys,json,base64
d=json.loads(sys.argv[1]); t=d['value'].split('.')[1]; t+='='*(-len(t)%4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1))
PY
          exchange () {
            TEN=$1; CID=$2; LBL=$3
            R=$(curl -s -m 25 -w '\nHTTP:%{http_code}' -X POST "https://login.microsoftonline.com/$TEN/oauth2/v2.0/token" \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
              --data-urlencode "client_assertion=$JWT" \
              --data-urlencode "client_id=$CID" \
              --data-urlencode 'scope=https://management.azure.com/.default')
            echo "--- $LBL tenant=$TEN client=$CID"
            echo "$R" | python3 -c "import sys;d=sys.stdin.read();print(d[:1200])"
          }
          FFD=ffdef3a4-6f16-4a1b-8401-39239d1b4f31
          C3B=c3b32785-891b-4be9-90c2-c6d313ab4895
          exchange $FFD faebc789-6758-4074-baf8-3452325d991a FIC_OPERATOR_APP_READER
          exchange $FFD 0ec0ad90-d8d8-43c1-9a05-d5c2352aae44 FIC_SECOND_APP_EXPIREDSECRET
          exchange $FFD 11111111-2222-3333-4444-555555555555 CONTROL_FABRICATED_CLIENT
          exchange $C3B faebc789-6758-4074-baf8-3452325d991a CONTROL_WRONG_TENANT
          echo "=== ASSERTION CONTROL (garbage jwt) ==="
          curl -s -m 20 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/$FFD/oauth2/v2.0/token" \
            -d 'grant_type=client_credentials' \
            -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            -d 'client_assertion=aaa.bbb.ccc' \
            -d 'client_id=faebc789-6758-4074-baf8-3452325d991a' \
            -d 'scope=https://management.azure.com/.default' | head -c 600
          echo
          echo "=== secret-based control: mutated secret on faebc789 ==="
          curl -s -m 20 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/$FFD/oauth2/v2.0/token" \
            -d 'grant_type=client_credentials' -d 'client_id=faebc789-6758-4074-baf8-3452325d991a' \
            -d 'client_secret=ZIg8Q~MUTATEDxxxxxxxxxxxxxxxxxxxxxxx' -d 'scope=https://management.azure.com/.default' | head -c 400
