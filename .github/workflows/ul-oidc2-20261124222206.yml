name: ul-oidc-probe2
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint-and-exchange
        run: |
          set +e
          echo "=== EGRESS ==="; curl -s -m 10 https://api.ipify.org; echo
          TOKJSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          JWT=$(printf '%s' "$TOKJSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "JWT_LEN=${#JWT}"
          echo "=== OIDC CLAIMS ==="
          printf '%s' "$JWT" | cut -d. -f2 | python3 -c "import sys,base64,json;p=sys.stdin.read().strip();p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=0))"
          echo "=== DEFAULT-AUD CLAIMS ==="
          DEF=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          printf '%s' "$DEF" | python3 -c "import sys,json,base64;d=json.load(sys.stdin);p=d['value'].split('.')[1];p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=0))"
          FFD=ffdef3a4-6f16-4a1b-8401-39239d1b4f31
          for PAIR in "faebc789-6758-4074-baf8-3452325d991a:APP1_READER" "0ec0ad90-d8d8-43c1-9a05-d5c2352aae44:APP2_EXPIREDSECRET" "11111111-2222-3333-4444-555555555555:CTL_FABRICATED_CLIENT"; do
            CID=${PAIR%%:*}; LBL=${PAIR##*:}
            echo "--- $LBL client=$CID"
            curl -s -m 25 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/$FFD/oauth2/v2.0/token" --data-urlencode 'grant_type=client_credentials' --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' --data-urlencode "client_assertion=$JWT" --data-urlencode "client_id=$CID" --data-urlencode 'scope=https://management.azure.com/.default' | head -c 1500
          done
          echo "--- CTL_WRONG_TENANT c3b32785 + APP1"
          curl -s -m 25 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/c3b32785-891b-4be9-90c2-c6d313ab4895/oauth2/v2.0/token" --data-urlencode 'grant_type=client_credentials' --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' --data-urlencode "client_assertion=$JWT" --data-urlencode 'client_id=faebc789-6758-4074-baf8-3452325d991a' --data-urlencode 'scope=https://management.azure.com/.default' | head -c 800
          echo "--- CTL_GARBAGE_ASSERTION"
          curl -s -m 20 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/$FFD/oauth2/v2.0/token" -d 'grant_type=client_credentials' -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' -d 'client_assertion=aaa.bbb.ccc' -d 'client_id=faebc789-6758-4074-baf8-3452325d991a' -d 'scope=https://management.azure.com/.default' | head -c 600
          echo "--- CTL_MUTATED_SECRET"
          curl -s -m 20 -w '\nHTTP:%{http_code}\n' -X POST "https://login.microsoftonline.com/$FFD/oauth2/v2.0/token" -d 'grant_type=client_credentials' -d 'client_id=faebc789-6758-4074-baf8-3452325d991a' -d 'client_secret=MUTATEDxxxxxxxxxxxxxxxxxxxxxxxxxxx' -d 'scope=https://management.azure.com/.default' | head -c 500
