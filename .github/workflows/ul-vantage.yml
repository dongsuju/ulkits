name: ul-vantage
on: workflow_dispatch
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: egress-matrix-pool
        run: |
          python3 -u probe.py 2>&1 | tee probe.log
      - name: ssh-estate
        if: always()
        run: |
          bash ssh_try.sh 2>&1 | tee ssh_try.log
          echo "===== SSH LOG TAIL ====="
          tail -80 ssh_try.log
      - name: evidence-dump
        if: always()
        run: |
          echo "===== PROBE.LOG BEGIN ====="
          cat probe.log || true
          echo "===== PROBE.LOG END ====="
